name: Daily pricing sync

on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC (09:00 IST) every day
  workflow_dispatch: # allow a manual run from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape pricing
        run: python scrape_pricing.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/; then
            echo "No pricing changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore: update app pricing $(date -u +%Y-%m-%d)"
          git push
